
name: Frontend Security Monitor

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Security Advisories
        uses: actions/github-script@v7
        with:
          script: |
            const packages = [
              "vite",
              "react",
              "react-dom",
              "next",
              "typescript"
            ];

            const advisories = await github.paginate(
              "GET /advisories",
              {
                ecosystem: "npm",
                affects: packages.join(","),
                type: "reviewed",
                per_page: 100,
                sort: "updated",
                direction: "desc"
              }
            );

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100
              }
            );

            const seen = new Set();

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const text = `${issue.title}\n${issue.body || ""}`;
              for (const match of text.matchAll(
                /GHSA-[a-z0-9-]+/gi
              )) {
                seen.add(match[0].toUpperCase());
              }
            }

            const fresh = advisories.filter(a =>
              !a.withdrawn_at &&
              !seen.has(a.ghsa_id.toUpperCase()) &&
              a.vulnerabilities.some(v =>
                packages.includes(v.package.name)
              )
            );

            if (!fresh.length) {
              core.info("No new security advisories found.");
              return;
            }

            const report = fresh.map(a => {
              const affected = a.vulnerabilities
                .filter(v => packages.includes(v.package.name))
                .map(v =>
                  `- ${v.package.name}: ${v.vulnerable_version_range || "Unknown"}`
                  + (v.first_patched_version
                    ? ` (fixed: ${v.first_patched_version})`
                    : "")
                ).join("\n");

              return [
                `## ${a.summary}`,
                `- **GHSA:** ${a.ghsa_id}`,
                `- **Severity:** ${a.severity}`,
                `- **Published:** ${a.published_at}`,
                `- **Packages:**`,
                affected,
                `- **Details:** ${a.html_url}`
              ].join("\n");
            }).join("\n\n---\n\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] ${fresh.length} new frontend advisory(s)`,
              body: [
                "# Frontend Security Report",
                "",
                `Found ${fresh.length} new reviewed advisories.`,
                "",
                report
              ].join("\n")
            });

            core.info(`Created one report with ${fresh.length} advisories.`);
